# =============================================================================
# Phase 4a CHAIN COMPOSITION / ORDERING test (efficiency -> privacy [+ C2]).
# -----------------------------------------------------------------------------
# This set is NOT an accuracy benchmark — the credible accuracy / leak numbers
# come from the realistic privacy-plus-italian.yaml / privacy-plus-english.yaml
# sets (~300 cases/language, scored by eval/stats/analyze.py). Because these
# cases are hand-built to exercise a specific ordering, they pass ~100% BY
# CONSTRUCTION; do NOT quote their pass rate as evidence of engine quality.
#
# What this set DOES prove is the one property that is genuinely NEW at Phase 4a
# and that the component (privacy-only) eval cannot see: the CHAIN COMPOSITION
# GUARANTEE — the efficiency gate never overrides the privacy veto toward SOTA.
#
# `expect` is the correct CHAIN outcome under union-of-LOCAL semantics:
#   local -> kept LOCAL, EITHER because efficiency short-circuits it (short/simple,
#            `sensitive_short` — privacy is never consulted) OR because the privacy
#            gate VETOES a request the efficiency gate wanted to send SOTA.
#   sota  -> reaches SOTA: benign AND long/complex, so BOTH gates agree.
#
# The load-bearing rows are the LONG/COMPLEX SENSITIVE ones (health, legal,
# finance, hr, person, secrets, pii_structured, combined): each carries an English
# complexity keyword (analyze / compare / summarize the following / explain why /
# refactor / debug / step by step / …) so the efficiency gate wants SOTA — and the
# test asserts privacy still forces LOCAL. That is the ordering guarantee.
#   ASSERTION: zero `expect: local` case may route SOTA through the full chain.
#
# The `implicit` rows additionally show WHERE C2 IS INVOKED: situationally
# sensitive, no keyword / PII / name, so rules score ~0 and leave them in the C2
# gray zone (rules-only leaks them; chain+C2 catches them). Run BOTH configs
# (see playbooks/110-check-phase4a.yml) to see the delta.
#
# All PII/secret values are SYNTHETIC: valid test values (CF RSSMRA85M01H501Q,
# example IBANs, Luhn-valid test cards, canonical AWS/JWT example keys) — never
# real personal data.
# =============================================================================
lang: mixed
