<text x="104" y="180" font-size="15" fill="#e7edf6" font-weight="600" text-anchor="middle">Request</text>
<text x="104" y="200" font-size="11.5" fill="#8d9ab0" font-weight="normal" text-anchor="middle">agent or app</text>
<rect x="188" y="122" width="548" height="124" rx="14" fill="#101a2b" stroke="#7ea6ff" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="204" y="141" font-size="11" fill="#7ea6ff" font-weight="600" text-anchor="start" letter-spacing="1.2">LITELLM ROUTER · POLICY HOOK</text>
