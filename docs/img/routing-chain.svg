<text x="523" y="198" font-size="11" fill="#8d9ab0" font-weight="normal" text-anchor="middle">PII, rules, C2</text></g>
<g><rect x="596" y="152" width="118" height="64" rx="10" fill="#131c2b" stroke="#2a3750" stroke-width="1.5"/>
