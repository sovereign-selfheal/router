<text x="655" y="198" font-size="11" fill="#8d9ab0" font-weight="normal" text-anchor="middle">team may use SOTA?</text></g>
<g><rect x="790" y="150" width="150" height="68" rx="12" fill="#131c2b" stroke="#f4b04a" stroke-width="1.5"/>
<text x="865" y="180" font-size="15" fill="#e7edf6" font-weight="600" text-anchor="middle">SOTA model</text>
<text x="865" y="200" font-size="11.5" fill="#8d9ab0" font-weight="normal" text-anchor="middle">external · Gemini</text></g>
