<text x="391" y="198" font-size="11" fill="#8d9ab0" font-weight="normal" text-anchor="middle">short? budget left?</text></g>
<g><rect x="464" y="152" width="118" height="64" rx="10" fill="#131c2b" stroke="#2a3750" stroke-width="1.5"/>
