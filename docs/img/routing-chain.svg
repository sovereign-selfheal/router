<circle r="7" fill="#e7edf6" stroke="#34d3b8" stroke-width="3" opacity="0"><animateMotion dur="20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.608;0.72;1" path="M104,184 L655,184 L655,216 C655,300 520,300 500,356"/><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.604;0.609;0.775;0.78;1" values="0;0;1;1;0;0"/></circle>
