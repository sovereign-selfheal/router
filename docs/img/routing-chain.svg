<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Routing chain of the router</title>
<desc id="d">A request passes four steps in order: namespace gate, efficiency gate, privacy gate, tiering. The first step that says LOCAL sends it to the local GPU model in the cluster; only a request that passes every step goes to the external SOTA model.</desc>
<style>.static{display:none}@media (prefers-reduced-motion: reduce){.anim{display:none}.static{display:inline}}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6e92"/></marker><marker id="arrow-local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d3b8"/></marker><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="960" height="500" rx="18" fill="#0c1320"/>
<text x="28" y="40" font-size="19" fill="#e7edf6" font-weight="600" text-anchor="start">How the router decides, request by request</text>
<text x="28" y="62" font-size="12.5" fill="#8d9ab0" font-weight="normal" text-anchor="start">router v0.12.0 · the first step that says LOCAL wins · SOTA only when every step lets the request pass</text>
