# Policy: chain  (Phase 4a — composed routing: efficiency -> privacy)
# =============================================================================
# Additive, NON-BREAKING successor that COMPOSES the earlier policies instead of
# picking one. The shipped cost.yaml / complexity.yaml / privacy.yaml and the
# privacy-plus engine are UNTOUCHED and still selectable for earlier phases.
#
# SEMANTICS (union-of-LOCAL / intersection-of-SOTA):
#   Gates are evaluated in `gate_order`. The FIRST gate that says LOCAL wins
#   (short-circuit). A request reaches SOTA only if EVERY gate says SOTA.
#   Because `privacy` is LAST, no payload reaches SOTA without clearing the
#   privacy scan — the sovereignty guarantee, for free, from the ordering.
#
# Consumed by litellm/policy_hook_chain.py, selected by running LiteLLM with
# litellm/config-chain.yaml (see manifests/70-chain/).
#
# SUPPORT STATUS: LiteLLM is community / customer-operated, and the privacy gate
# additionally calls the community Presidio analyzer — NOT Red Hat-supported
# (CLAUDE.md §3). Both run in-cluster on CPU with no external egress. The real
# LOCAL<->SOTA fan-out to an external provider is Tech Preview.
# =============================================================================
policy: chain
local_model: local-fast
sota_model: sota-smart

# Backstop for SOTA token accounting, used only when the routing metadata is lost.
# Matched against the model id seen at response time — either the one the PROVIDER
# reports ("qwen38-27b-fp8") or the configured one ("openai/Qwen3.8-27B"). Both sides
# are normalised to bare alphanumerics, so this single token covers every form.
# Comma-separated string or YAML list; "" disables it.
# UPDATE THIS whenever sota_model_name changes, or budget capping degrades silently.
sota_served_match: "qwen38-27b"


# Order of evaluation. First gate returning LOCAL short-circuits the decision.
gate_order: [efficiency, privacy]

# --- Gate 1 — efficiency (MERGED cost + complexity) --------------------------
# The two old policies overlapped heavily (both keyed off length/complexity), so
# they collapse into ONE gate here. LOCAL when the user question is short AND
# simple AND not flagged by a complex keyword; also LOCAL once the cumulative
# SOTA token budget is exhausted (cost cap, off by default). Otherwise SOTA. Reads the user
# question only (the last user turn) — length/complexity is a property of the ask.
# Exception (router >= v0.8.0): the SOTA size cap below measures the WHOLE request.
efficiency:
  max_prompt_chars_for_local: 280   # at/under this (chars) contributes to LOCAL
  simple_max_words: 40              # at/under this (words) contributes to LOCAL
  complex_keywords:                 # any match marks the query complex -> SOTA
    - analyze
    - compare
    - summarize the following
    - explain why
    - prove
    - derive
    - refactor
    - debug
    - step by step
    - reasoning
    # Italian (the demo runs in English; Italian prompts work too). Matching is a
    # lowercase substring, so stems cover several forms: "confront" matches
    # confronta, confrontando, confronto.
    - analizz
    - confront
    - riassum
    - spiega perch
    - dimostr
    - rifattorizz
    - passo dopo passo
    - passo passo
    - ragionament
  sota_token_budget: 0              # cumulative SOTA tokens before fallback-to-LOCAL; 0 = no cap.
                                    # Off because the counter is in memory and per pod, has no
                                    # time window and resets only when the pod restarts: once
                                    # full, that pod sends every request LOCAL until it
                                    # restarts, while the other pod may still use SOTA, with
                                    # only a log line to explain it. 100000 was reached after
                                    # 30-60 SOTA answers in a demo day. The spend limit is the
                                    # quota of the SOTA provider on its API key; the per-tier
                                    # limits of the gateway bound the token rate. A value > 0
                                    # turns the cap on again (for example to show fallback).
                                    # Superseded by sota_budget (v0.12.0) below.
  # SOTA token budget per tier (router >= v0.12.0; default off: no tier has a budget). The tier
  # is the x-team header that the gateway sets from the API key. When the SOTA tokens of a tier
  # in the last window reach its budget, the request stays LOCAL (decided_by efficiency); the
  # 429 of the gateway tiers stays as the ceiling. Counters in Redis, shared by the LiteLLM pods;
  # a Redis error fails open (no budget). Env overrides: SOTA_BUDGET_TIERS (JSON),
  # SOTA_BUDGET_WINDOW_S, SOTA_BUDGET_REDIS_URL, SOTA_BUDGET_REDIS_PASSWORD.
  sota_budget:
    window_s: 300
    tiers: {}                       # tier -> SOTA tokens per window, e.g. {agents: 150000}
    redis_url: ""                   # redis://host:6379/0
  # SOTA size cap (router >= v0.8.0; default 0 = off). Size of the WHOLE request in characters:
  # every message, tool output, tool call arguments and tool definitions. Above the cap the
  # request stays LOCAL (reason "efficiency: SOTA context limit") and no detector runs: the SOTA
  # model could not take it, and Presidio and C2 would spend seconds on it for nothing. A counting
  # error also routes LOCAL. Characters, not tokens: the router has no tokenizer, and the SOTA
  # model counts with its own. Choose the value as
  #   (SOTA context window - max_tokens of the agents - margin) x characters per token.
  # Log text has about 2.3 characters per token (measured on 2026-10-01), English prose about 4:
  # a cap computed for log text is safe and keeps prose LOCAL earlier than needed. Example: a
  # 65,536-token window, max_tokens 8192 (components/triage-agent) and a 10% margin give about
  # 51,000 tokens, so about 117000 characters. Off until the window of the SOTA model is known.
  sota_max_prompt_chars: 0

# --- Gate 2 — privacy --------------------------------------------------------
# Reuses the hardened privacy-plus engine (A regex+validators, B lexicons,
# C1 Presidio NER, optional C2 LLM classifier). To keep ONE source of truth for
# privacy tuning, the engine loads its detectors/threshold from this file:
privacy_policy_file: privacy-plus   # -> policy/privacy-plus.yaml (mounted alongside)

# --- Namespace policy (router >= v0.11.0; default off) ----------------------
# Checked BEFORE the gates. A request about a namespace with the label
# `<label>=restricted` stays LOCAL and no gate runs (decided_by "namespace"). No label,
# `public` or another value keeps the normal routing. The router finds the namespaces of a
# request in two ways, each with its own switch:
#   hint: the agent sends the names in the request body, field `<hint_field>` (a list).
#   scan: the router finds names in the request text (PromQL `namespace="x"`, JSON/YAML
#         `namespace` keys, `x.svc`, `-n x`, `/namespaces/x`).
# Either one naming a restricted namespace is enough. The hint field is removed from every
# request, also when the hint is off. The labels come from the Kubernetes API (list of
# namespaces with the label key, every `refresh_s` seconds); the ServiceAccount of LiteLLM
# needs get/list/watch on namespaces. Env overrides: NAMESPACE_SCAN_ENABLED,
# NAMESPACE_HINT_ENABLED (unset or empty = this file decides).
namespace_policy:
  scan: false
  hint: false
  label: sovereign-selfheal.io/data-class
  hint_field: selfheal_namespaces
  refresh_s: 5

# --- Per-team guardrail (applied AFTER the chain) ----------------------------
# A team capped to LOCAL never reaches SOTA regardless of the gate outcome. Can
# only pull toward LOCAL, never toward SOTA (same semantics as cost/complexity).
tiering:
  legal: [local-fast]
  research: [local-fast, sota-smart]
  _default: [local-fast, sota-smart]
